<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Lumo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="island" id="island" data-mode="resting" data-expanded="false">
      <div class="motion-layer" aria-hidden="true"><i></i><i></i><i></i></div>

      <header class="primary" id="primary" role="button" aria-expanded="false" tabindex="0">
        <div class="pet-wrap" aria-hidden="true">
          <span class="pet-glow"></span>
          <svg class="kawaii-bot" viewBox="0 0 240 240" role="presentation">
            <g class="bot-antenna">
              <path d="M120 32V19" />
              <circle cx="120" cy="14" r="6" />
            </g>
            <g class="bot-arm bot-arm-left">

              <path class="bot-shell" fill-rule="evenodd" d="m30.139 142.723 6.311 6.338c3.746 3.636 9.706 3.28 12.977-.833l10.606-13.818c2.5-3.384 2.251-8.273-.762-11.137l-2.79-2.783c-2.931-3.088-7.895-3.379-11.127-.767l-13.986 10.568c-4.513 2.65-4.975 8.796-1.23 12.432Z" clip-rule="evenodd" />
              <path class="bot-shadow" fill-rule="evenodd" d="m30.139 142.723 6.311 6.338c3.746 3.636 9.706 3.28 12.977-.833l10.606-13.818c2.5-3.384 2.251-8.273-.762-11.137l-2.79-2.783c-2.931-3.088-7.895-3.379-11.127-.767l-13.986 10.568c-4.513 2.65-4.975 8.796-1.23 12.432Z" clip-rule="evenodd" />
              <circle class="bot-shell" cx="30.387" cy="147.612" r="9.03" />
            </g>
            <g class="bot-arm bot-arm-right">
              <path class="bot-shell" fill-rule="evenodd" d="M211.848 156.086c.672-.244 1.567-.57 2.158-1.038l1.618 10.018c.344 1.643-.898 3.105-2.322 3.371-1.648.347-3.111-.888-3.151-2.389l-1.517-9.044c.895-.326 2.095-.511 3.214-.918Zm19.031 10.499-.448.163c-1.343.489-2.787.005-3.497-1.252-2.763-4.803-6.787-8.895-11.972-11.301 1.548-1.321 2.404-3.148 2.731-5.035 5.876 2.913 10.977 7.875 14.369 13.712.63 1.033.221 2.697-1.183 3.713ZM187.712 123.2l-22.784-21.508-5.131 5.403 19.857 19.038 8.058-2.933Z" clip-rule="evenodd" />
              <path class="bot-shell" fill-rule="evenodd" d="m209.013 142.723-6.312 6.338c-3.746 3.636-9.706 3.28-12.977-.833l-10.606-13.818c-2.499-3.384-2.251-8.273.762-11.137l2.79-2.783c2.932-3.088 7.895-3.379 11.127-.767l13.986 10.568c4.513 2.65 4.976 8.796 1.23 12.432Z" clip-rule="evenodd" />
              <path class="bot-shadow" fill-rule="evenodd" d="m209.013 142.723-6.312 6.338c-3.746 3.636-9.706 3.28-12.977-.833l-10.606-13.818c-2.499-3.384-2.251-8.273.762-11.137l2.79-2.783c2.932-3.088 7.895-3.379 11.127-.767l13.986 10.568c4.513 2.65 4.976 8.796 1.23 12.432Z" clip-rule="evenodd" />
              <circle class="bot-shell" cx="208.765" cy="147.612" r="9.03" />
            </g>
            <g class="bot-legs">
              <path class="bot-shell" d="M138.495 166.555h8.317v20.1h-8.317zM92.751 166.555h8.317v20.1h-8.317z" />
              <path class="bot-shell" fill-rule="evenodd" d="M158.318 200.933c-.832-13.03-7.486-23.288-15.803-23.288s-15.248 10.258-15.803 23.288h31.606Zm-.555-.416H126.99c-2.495 0-4.436 1.941-4.436 4.436s1.941 4.436 4.436 4.436h30.773c2.495 0 4.436-1.941 4.436-4.436-.277-2.495-2.218-4.436-4.436-4.436Zm-45.19.416c-.831-13.03-7.485-23.288-15.802-23.288s-15.249 10.258-15.803 23.288h31.605Zm-.554-.416H81.245c-2.495 0-4.436 1.941-4.436 4.436s1.941 4.436 4.436 4.436h30.774c2.495 0 4.436-1.941 4.436-4.436s-1.941-4.436-4.436-4.436Z" clip-rule="evenodd" />
            </g>
            <g class="bot-torso">
              <path class="bot-shell" fill-rule="evenodd" d="M65.521 107.324c-1.085 24.411 1.464 64.531 54.26 64.531 52.779 0 55.344-39.602 54.262-64.212.428-7.837-.045-15.237-.415-21.022-.19-2.967-.353-5.509-.353-7.467C173.275 48.996 149.325 30 119.781 30c-29.543 0-53.493 18.996-53.493 49.154 0 1.848-.159 4.284-.346 7.152-.371 5.706-.854 13.122-.42 21.018Z" clip-rule="evenodd" />
              <path class="bot-body-shade" fill-rule="evenodd" d="M115.021 171.741c48.146-2.34 50.521-40.255 49.473-64.098.428-7.837-.046-15.237-.416-21.022-.189-2.967-.352-5.509-.352-7.467 0-28.515-21.412-47.052-48.719-48.986a67.574 67.574 0 0 1 4.774-.168c29.544 0 53.494 18.996 53.494 49.154 0 1.958.163 4.5.353 7.466.37 5.786.843 13.186.415 21.023 1.082 24.61-1.483 64.212-54.262 64.212-1.634 0-3.22-.039-4.76-.114Z" clip-rule="evenodd" />
              <path class="bot-faceplate" fill-rule="evenodd" d="M119.4 113.457c40.959 0 40.959-8.499 40.959-28.418 0-19.92-8.614-26.793-40.959-26.793-32.344 0-40.959 6.873-40.959 26.793 0 19.919 0 28.418 40.959 28.418Z" clip-rule="evenodd" />
              <circle class="bot-core" cx="119.5" cy="143" r="9" />
              <path class="bot-core-mark" d="M119.5 136v14M112.5 143h14" />
            </g>
            <g class="bot-expression">
              <g class="bot-eyes bot-eyes-dot"><ellipse cx="101" cy="83" rx="6" ry="7" /><ellipse cx="138" cy="83" rx="6" ry="7" /></g>
              <g class="bot-eyes bot-eyes-happy"><path d="M92 86q9-13 18 0M129 86q9-13 18 0" /></g>
              <g class="bot-eyes bot-eyes-error"><path d="m94 77 13 13m0-13L94 90m38-13 13 13m0-13-13 13" /></g>
              <path class="bot-mouth bot-mouth-neutral" d="M113 100h13" />
              <path class="bot-mouth bot-mouth-smile" d="M108 97q11.5 13 23 0" />
              <ellipse class="bot-mouth bot-mouth-open" cx="119.5" cy="99" rx="8" ry="6" />
              <g class="bot-blush"><circle cx="91" cy="98" r="4" /><circle cx="148" cy="98" r="4" /></g>
            </g>
          </svg>
          <span class="pet-thought"><i></i><i></i><i></i></span>
          <span class="pet-signal">!</span>
        </div>

        <div class="summary" aria-live="polite">
          <div class="eyebrow">
            <span><i class="status-dot"></i><b id="connection">LOCAL CODEX</b></span>
            <span class="task-name" id="taskTitle">等待下一项任务</span>
          </div>
          <div class="status-line">
            <strong id="phase">等待 Codex</strong>
            <span id="detail">正在寻找本地任务</span>
          </div>
          <span class="progress-rail" aria-hidden="true"><i></i></span>
        </div>

        <div class="system-strip" aria-label="电脑状态">
          <div class="compact-metric" title="CPU 使用率">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1"/><path d="M6 1v3m4-3v3M6 12v3m4-3v3M1 6h3m-3 4h3m8-4h3m-3 4h3"/></svg>
            <span><b id="cpuValue">0</b><i>%</i></span>
          </div>
          <div class="compact-metric" title="内存使用率">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="4" width="12" height="8" rx="1"/><path d="M5 7h6M5 9h4M4 2v2m3-2v2m3-2v2m2-2v2M4 12v2m3-2v2m3-2v2m2-2v2"/></svg>
            <span><b id="memoryValue">0</b><i>%</i></span>
          </div>
        </div>

        <div class="run-state" aria-label="任务进度">
          <span class="progress-orb"><b id="progress">0</b><i>%</i></span>
          <time id="elapsed">00:00</time>
        </div>
      </header>

      <div class="details">
        <section class="system-panel">
          <div class="system-head">
            <span class="micro">SYSTEM TELEMETRY</span>
            <span id="systemUpdated">LIVE</span>
          </div>
          <div class="system-cards">
            <div class="system-card cpu-card"><span>CPU</span><strong><b id="cpuDetail">0</b>%</strong><i><em id="cpuBar"></em></i></div>
            <div class="system-card memory-card"><span>MEMORY</span><strong><b id="memoryDetail">0</b>%</strong><i><em id="memoryBar"></em></i></div>
          </div>
        </section>

        <section class="task-panel">
          <div class="panel-head">
            <div><span class="micro">ACTIVE TASKS</span><strong>正在运行的任务</strong></div>
            <span class="live-badge"><i></i><b id="taskCount">0</b> RUNNING</span>
          </div>
          <ol class="task-list" id="taskList">
            <li class="task-empty"><span>等待 Codex 任务</span><b>STANDBY</b></li>
          </ol>
        </section>

        <section class="event-panel">
          <div class="event-head">
            <span class="micro">LIVE EVENTS</span>
            <span id="workspace">CODEX HOME</span>
          </div>
          <ol id="events"><li><i></i><span>等待 Codex 事件</span><time>NOW</time></li></ol>
        </section>

        <footer>
          <button class="text-button" id="logsButton">打开日志目录</button>
          <span>单击展开 · 全窗拖动 · Ctrl Alt L 召回</span>
          <button class="text-button danger" id="quitButton">退出</button>
        </footer>
      </div>
    </section>
    <script src="renderer.js"></script>
  </body>
</html>
