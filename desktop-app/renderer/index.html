<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Lumo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="island" id="island" data-mode="resting" data-expanded="false">
      <div class="motion-layer" aria-hidden="true"><i></i><i></i><i></i></div>
      <header class="primary drag-region">
        <div class="pet-wrap" aria-hidden="true">
          <div class="pixel-pet">
            <span class="bot-shadow"></span>
            <i class="pixel-antenna"></i>
            <span class="pixel-head">
              <span class="pixel-face"><i></i><i></i><b></b></span>
              <span class="head-light"></span>
            </span>
            <span class="pixel-torso"><span class="pixel-core"></span></span>
            <span class="pixel-arm pixel-arm-left"><i></i></span>
            <span class="pixel-arm pixel-arm-right"><i></i></span>
            <span class="pixel-leg pixel-leg-left"><i></i></span>
            <span class="pixel-leg pixel-leg-right"><i></i></span>
            <span class="pixel-fx pixel-fx-one"></span>
            <span class="pixel-fx pixel-fx-two"></span>
            <span class="pixel-orbit pixel-orbit-one"></span>
            <span class="pixel-orbit pixel-orbit-two"></span>
            <span class="pixel-sleep">Z</span>
          </div>
        </div>

        <div class="summary" id="summary" aria-live="polite">
          <span class="eyebrow"><i class="status-dot"></i><b id="connection">LOCAL CODEX</b></span>
          <strong id="phase">等待 Codex</strong>
          <span id="detail">正在寻找本地任务</span>
        </div>

        <div class="telemetry">
          <span class="bars"><i></i><i></i><i></i><i></i></span>
          <time id="elapsed">00:00</time>
        </div>

        <button class="progress no-drag" id="progressButton" aria-label="展开任务详情">
          <span id="progress">0</span><i>%</i>
        </button>

        <div class="window-actions no-drag">
          <button id="passButton" title="鼠标穿透">◇</button>
          <button id="hideButton" title="隐藏到托盘">—</button>
        </div>
      </header>

      <div class="details">
        <div class="task-panel">
          <div class="panel-head">
            <div><span class="micro">ACTIVE TASKS</span><strong>正在运行的任务</strong></div>
            <span class="live-badge"><i></i><b id="taskCount">0</b> RUNNING</span>
          </div>
          <ol class="task-list" id="taskList">
            <li class="task-empty"><span>等待 Codex 任务</span></li>
          </ol>
        </div>

        <div class="event-panel">
          <div class="event-head">
            <span class="micro">LIVE EVENTS</span>
            <span id="workspace">CODEX HOME</span>
          </div>
          <ol id="events"><li><i></i><span>等待 Codex 事件</span><time>NOW</time></li></ol>
        </div>

        <footer>
          <button class="text-button no-drag" id="logsButton">打开日志目录</button>
          <span>拖动移动 · Ctrl Alt L 显示/隐藏</span>
          <button class="text-button danger no-drag" id="quitButton">退出</button>
        </footer>
      </div>
    </section>
    <script src="renderer.js"></script>
  </body>
</html>
